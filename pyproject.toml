[project]
name = "Argent-vpn-manager"
version = "1.1.0"
description = "VPN panels manager of Argent service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "cryptography>=48.0.0",
    "outline-vpn-api>=6.6.1",
    "requests>=2.33.1",
    "click>=8.4.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",          
    "pytest-asyncio>=0.21.0", 
    "ruff>=0.1.0",       
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]
fixable = ["ALL"]
allowed-confusables = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "Depends"]

[tool.ruff.lint.isort]
known-first-party = ["src"]